<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBER SMASH</title>
<style>
  /* Full-window black stage; the canvas is centered and scaled by JS (see resize()). */
  html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<script>
"use strict";
/* =====================================================================
   CYBER SMASH — a parody "destroy the car" bonus stage.
   Single file, vanilla JS, everything drawn with canvas shapes.
   ===================================================================== */

// ---------------------------------------------------------------------
// 1. Core constants & canvas setup
// ---------------------------------------------------------------------
const W = 640, H = 360;            // logical resolution (16:9), scaled up by CSS
const GROUND_Y = 300;              // y of the dock floor where characters stand
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Scale the canvas to the largest size that fits the window while keeping 16:9.
// Prefer integer multiples when the window is big enough, to keep pixels crisp.
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const scale = s >= 2 ? Math.floor(s * 2) / 2 : s;   // snap to 0.5 steps above 2x
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------
// 2. Input: keyboard state + one-shot "pressed this frame" events
// ---------------------------------------------------------------------
const keys = {};        // currently held keys (by lowercase key name / code)
const pressed = {};     // keys that went down since the last update tick
const KEYMAP = {
  arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right',
  j: 'punch', k: 'kick', l: 'special',
  ' ': 'confirm', enter: 'confirm', m: 'mute', escape: 'back',
  arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down',
};
window.addEventListener('keydown', e => {
  Sound.init();                              // audio may only start after a user gesture
  const act = KEYMAP[e.key.toLowerCase()];
  if (!act) return;
  e.preventDefault();
  if (act === 'mute' && !e.repeat) Sound.toggle();
  if (!keys[act]) pressed[act] = true;   // ignore OS key-repeat
  keys[act] = true;
});
window.addEventListener('keyup', e => {
  const act = KEYMAP[e.key.toLowerCase()];
  if (act) keys[act] = false;
});
// Losing focus must not leave keys "stuck".
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------------------------------------------------------------------
// 3b. Audio: every sound is synthesized with the Web Audio API (no audio files).
//     Browsers only allow audio after a user gesture, so the context is created on the first key press.
//     M toggles mute (remembered across reloads when localStorage is available).
// ---------------------------------------------------------------------
const Sound = {
  ac: null, master: null, noiseBuf: null, muted: false,
  load() { try { this.muted = localStorage.getItem('cybersmash-muted') === '1'; } catch (e) {} },
  // Create (or resume) the AudioContext. Safe to call on every key press.
  init() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ac.destination);
      // one second of white noise, reused by every noise-based effect
      this.noiseBuf = this.ac.createBuffer(1, this.ac.sampleRate, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ac.state === 'suspended') this.ac.resume();
  },
  toggle() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.5;
    try { localStorage.setItem('cybersmash-muted', this.muted ? '1' : '0'); } catch (e) {}
  },
  // A pitched tone gliding from f0 to f1 over `dur` seconds, with a fast attack and exponential decay.
  tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  // Filtered noise burst; the filter sweeps from f0 to f1 (great for thuds, crunches, whooshes).
  noise(dur, vol, ftype = 'lowpass', f0 = 1000, f1 = f0, delay = 0) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay, src = this.ac.createBufferSource(), fl = this.ac.createBiquadFilter(), g = this.ac.createGain();
    src.buffer = this.noiseBuf; fl.type = ftype;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl); fl.connect(g); g.connect(this.master); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.02);
  },
  rnd() { return 0.92 + Math.random() * 0.16; },        // small pitch variation so repeats don't sound robotic
  // --- named effects ---
  punch() { const r = this.rnd(); this.tone(170 * r, 50, 0.12, 'sine', 0.8); this.noise(0.06, 0.4, 'lowpass', 900); },
  kick()  { const r = this.rnd(); this.tone(120 * r, 35, 0.2, 'sine', 1); this.noise(0.12, 0.6, 'lowpass', 600); },
  tick()  { this.tone(300 * this.rnd(), 120, 0.05, 'triangle', 0.25); },
  whiff() { this.noise(0.12, 0.15, 'bandpass', 1400, 400); },
  crunch(heavy = 1) {                                   // crumpling sheet metal
    this.noise(0.2 * heavy, 0.45, 'bandpass', 1800, 500); this.tone(230 * this.rnd(), 80, 0.16, 'sawtooth', 0.22);
    this.tone(1300, 800, 0.1, 'square', 0.08, 0.02);
  },
  glass() {                                             // shatter: hiss + random tinkles
    this.noise(0.4, 0.3, 'highpass', 5000, 3000);
    for (let i = 0; i < 7; i++) this.tone(2400 + Math.random() * 3000, 1500, 0.08, 'triangle', 0.1, Math.random() * 0.25);
  },
  beep(final = false) { final ? this.tone(1320, 1320, 0.5, 'square', 0.25) : this.tone(880, 880, 0.1, 'square', 0.22); },
  boom() { this.noise(0.9, 0.9, 'lowpass', 500, 60); this.tone(70, 25, 0.7, 'sine', 1); },
  blip() { this.tone(660, 660, 0.05, 'square', 0.12); },
  confirm() { this.tone(660, 1320, 0.12, 'square', 0.16); },
  ready() { this.tone(440, 440, 0.2, 'square', 0.18); },
  smash() { this.tone(880, 880, 0.3, 'square', 0.2); this.tone(1320, 1320, 0.3, 'square', 0.12); },
  stage(st) {                                           // each damage stage has its own cue
    if (st === 1) this.glass();
    else if (st === 2) this.crunch(1.6);
    else if (st === 3) { this.crunch(2); this.tone(90, 40, 0.3, 'sine', 0.8); this.tone(600, 400, 0.25, 'square', 0.1, 0.2); this.tone(450, 300, 0.25, 'square', 0.1, 0.45); }  // "RECALL" siren
    else { this.boom(); this.crunch(2.5); }
  },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, f, 0.18, 'square', 0.18, i * 0.11)); },
  lose() { [392, 370, 349, 262].forEach((f, i) => this.tone(f, f * 0.97, 0.3, 'sawtooth', 0.18, i * 0.3)); },   // sad trombone
  // Start-of-special cue, one flavor per fighter.
  special(id) {
    if (id === 'tromp') { this.tone(300, 600, 0.3, 'sawtooth', 0.15); this.tone(200, 40, 0.15, 'sine', 1, 0.5); }   // wind-up, stamp thud
    else if (id === 'muskrat') { this.noise(0.7, 0.5, 'lowpass', 2500, 800, 0.2); this.tone(100, 200, 0.6, 'sawtooth', 0.15, 0.2); }  // whoosh
    else if (id === 'zuckerbot') { this.noise(0.3, 0.3, 'bandpass', 400, 2000); for (let i = 0; i < 4; i++) this.tone(300 + i * 150, 300 + i * 150, 0.08, 'square', 0.1, 0.45 + i * 0.1); }  // low-poly bleeps
    else if (id === 'hassabyte') { for (let i = 0; i < 12; i++) this.tone(400 + i * 60, 400 + i * 60, 0.05, 'square', 0.1, 0.1 + i * 0.075); }   // calculating
    else if (id === 'hwatt') { this.tone(200, 1600, 0.12, 'sawtooth', 0.2); for (let i = 0; i < 12; i++) this.tone(250 * this.rnd(), 100, 0.04, 'square', 0.15, 0.1 + i * 0.055); }
    else if (id === 'oldman') { for (let i = 0; i < 4; i++) this.tone(1500, 1300, 0.03, 'square', 0.1, 0.2 + i * 0.12); this.tone(300, 2000, 0.25, 'sawtooth', 0.15, 0.4); }  // typing + laser
  },
};
Sound.load();

// ---------------------------------------------------------------------
// 3. Drawing helpers (chunky pixel-style primitives)
// ---------------------------------------------------------------------
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
// Bitmap-ish text using a bold monospace font; shadow gives the arcade look.
function text(str, x, y, size, color, align = 'center', shadow = '#000') {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, Math.round(x) + 2, Math.round(y) + 2); }
  ctx.fillStyle = color;
  ctx.fillText(str, Math.round(x), Math.round(y));
}

// ---------------------------------------------------------------------
// 4. Harbor background: sky, sea, cargo ships, cranes, crates, dock
// ---------------------------------------------------------------------
function drawCargoShip(x, y, scale, hull) {
  const s = scale;
  rect(x, y, 150 * s, 18 * s, hull);                     // hull
  rect(x - 8 * s, y, 8 * s, 10 * s, hull);               // bow slope (blocky)
  rect(x + 150 * s, y, 6 * s, 10 * s, hull);
  rect(x, y + 12 * s, 150 * s, 3 * s, '#8a1c1c');        // waterline stripe
  // container stacks in bright primary colors
  const cols = ['#d94a2b', '#2b7bd9', '#e8c321', '#3aa655', '#8e44ad'];
  for (let i = 0; i < 6; i++) {
    for (let j = 0; j < 2 + (i % 2); j++) {
      rect(x + 10 * s + i * 22 * s, y - (j + 1) * 12 * s, 20 * s, 11 * s, cols[(i + j) % cols.length]);
    }
  }
  rect(x + 120 * s, y - 30 * s, 24 * s, 30 * s, '#e8e8e8');   // bridge tower
  rect(x + 124 * s, y - 25 * s, 16 * s, 5 * s, '#4aa3df');    // bridge windows
}
function drawCrane(x, y) {
  const c = '#e0a31a';
  rect(x, y, 6, 150, c); rect(x + 24, y, 6, 150, c);          // legs
  rect(x - 40, y, 150, 8, c);                                  // jib
  rect(x + 80, y + 8, 2, 40, '#333');                          // cable
  rect(x + 74, y + 48, 14, 10, '#d94a2b');                     // hanging container
  for (let i = 0; i < 6; i++) rect(x + 6, y + 20 + i * 22, 18, 3, c);   // cross braces
}
function drawCrate(x, y, w, h, color) {
  rect(x, y, w, h, color);
  rect(x, y, w, 3, 'rgba(255,255,255,.25)');
  rect(x + 3, y + 3, w - 6, 2, 'rgba(0,0,0,.35)');             // plank lines
  rect(x + 3, y + h - 5, w - 6, 2, 'rgba(0,0,0,.35)');
  rect(x, y, 3, h, 'rgba(0,0,0,.3)'); rect(x + w - 3, y, 3, h, 'rgba(0,0,0,.3)');
  // diagonal brace
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + w - 4, y + h - 4); ctx.stroke();
}

let bgTime = 0;   // drives the gentle wave/seagull animation
function drawBackground() {
  // sky: banded gradient (retro style) from dusk orange to teal
  const bands = ['#2b1b4d', '#4a2a73', '#8a3f8f', '#d9577a', '#f28a5a', '#ffc16b'];
  for (let i = 0; i < bands.length; i++) rect(0, i * 28, W, 29, bands[i]);
  rect(470, 130, 46, 46, '#fff3b0');                 // chunky sun
  rect(476, 124, 34, 6, '#fff3b0'); rect(476, 176, 34, 6, '#fff3b0');
  // sea
  rect(0, 172, W, 128, '#1b4f8a');
  for (let i = 0; i < 14; i++) {                     // animated wave dashes
    const wx = ((i * 53 + bgTime * 20) % (W + 40)) - 20;
    rect(wx, 185 + (i % 5) * 20, 18, 2, '#3d8fd1');
  }
  // far ships + crane silhouettes
  drawCargoShip(40, 160, 1, '#2a2f3a');
  drawCargoShip(330, 168, 0.8, '#3a2f2a');
  drawCrane(560, 60);
  // seagull
  const gx = (bgTime * 25) % (W + 60) - 30, gy = 70 + Math.sin(bgTime * 2) * 6;
  rect(gx, gy, 6, 2, '#fff'); rect(gx + 6, gy - 2, 6, 2, '#fff'); rect(gx + 12, gy, 6, 2, '#fff');
  // dock: planks + crates
  rect(0, 262, W, 98, '#6b4a2b');
  rect(0, 262, W, 6, '#8a6238');
  for (let i = 0; i < 16; i++) rect(i * 42, 268, 2, 92, '#4a321d');  // plank seams
  rect(0, GROUND_Y + 16, W, 44, '#4a321d');
  drawCrate(10, 226, 40, 40, '#a8742f'); drawCrate(54, 238, 28, 28, '#8f5f26');
  drawCrate(14, 190, 30, 36, '#b8832f');
  drawCrate(590, 230, 44, 36, '#9c6a2a'); drawCrate(560, 244, 28, 22, '#b8832f');
  // bollards along the quay edge
  for (let i = 0; i < 5; i++) { rect(90 + i * 120, 252, 8, 10, '#222'); rect(88 + i * 120, 250, 12, 3, '#555'); }
}

// The shady salesman (right side, watching nervously). `mood` 0=smug, 1=nervous, 2=panic.
function drawSalesman(x, y, mood, t) {
  const sweat = mood > 0 && Math.floor(t * 4) % 2 === 0;
  rect(x - 8, y - 30, 16, 22, '#3b3b6b');            // suit
  rect(x - 2, y - 30, 4, 18, '#e03a3a');             // loud tie
  rect(x - 7, y - 8, 6, 10, '#222'); rect(x + 1, y - 8, 6, 10, '#222');   // legs
  rect(x - 9, y - 46, 18, 16, '#f2c9a0');            // big head
  rect(x - 10, y - 48, 20, 5, '#222');               // slick hair
  rect(x - 6, y - 40, 4, 4, '#fff'); rect(x + 2, y - 40, 4, 4, '#fff');   // eyes
  rect(x - 5 + (mood > 0 ? 1 : 0), y - 39, 2, 2, '#000'); rect(x + 3 + (mood > 0 ? 1 : 0), y - 39, 2, 2, '#000');
  rect(x - 8, y - 43, 5, 1, '#222'); rect(x + 3, y - 43, 5, 1, '#222');   // brows
  if (mood === 2) rect(x - 3, y - 34, 6, 5, '#600'); // mouth agape
  else rect(x - 4, y - 33, 8, 2, mood === 1 ? '#7a3b2e' : '#d9534f');
  if (sweat) rect(x + 10, y - 44, 3, 5, '#7fd4ff');  // sweat drop
  rect(x + 8, y - 24, 12, 8, '#2a7a3a');             // clutching a wad of cash
  text('$', x + 14, y - 20, 8, '#d7f7c2', 'center', null);
}

// ---------------------------------------------------------------------
// 5. Debris: generic flying chunks (glass, panels, sparks). Reused by later juice work.
// ---------------------------------------------------------------------
const debris = [];
// Spawns a chunk: pos, velocity, size, color, spin and lifetime (-1 = stays on the floor forever).
function spawnDebris(x, y, vx, vy, w, h, color, life = 2.5, opts = {}) {
  debris.push({ x, y, vx, vy, w, h, color, life, age: 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12,
                grounded: false, shape: opts.shape || 'rect', bounce: opts.bounce ?? 0.35 });
}
function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.age += dt;
    if (!d.grounded) {
      d.vy += 900 * dt;                        // gravity
      d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      const floor = GROUND_Y + 14 - d.h / 2;   // rest on the dock surface
      if (d.y > floor) {
        d.y = floor;
        if (Math.abs(d.vy) > 80) { d.vy = -d.vy * d.bounce; d.vx *= 0.7; d.vr *= 0.6; }
        else { d.grounded = true; d.vr = 0; d.vy = 0; }
      }
    }
    if (d.life >= 0 && d.age > d.life) debris.splice(i, 1);
  }
}
function drawDebris() {
  for (const d of debris) {
    // fade out in the last 0.5s of life
    const fade = d.life >= 0 ? Math.min(1, (d.life - d.age) / 0.5) : 1;
    ctx.save(); ctx.globalAlpha = fade;
    ctx.translate(Math.round(d.x), Math.round(d.y)); ctx.rotate(d.rot);
    ctx.fillStyle = d.color;
    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.restore();
  }
}

// ---------------------------------------------------------------------
// 5b. Juice: screen shake, freeze frames, comic text pops, impact bursts and a white flash.
//     Everything here is purely cosmetic; gameplay code only calls the small helpers below.
// ---------------------------------------------------------------------
let shakeAmt = 0;            // pixels of random camera offset; decays quickly
let freezeT = 0;             // seconds of "hit stop" left: the whole simulation pauses while > 0
let flashA = 0;              // 0..1 white screen flash
const popups = [];           // comic text: {text,x,y,t,life,color,size,rot}
const bursts = [];           // spiky impact stars: {x,y,t,r}
const addShake = a => { shakeAmt = Math.max(shakeAmt, a); };
const addFreeze = s => { freezeT = Math.max(freezeT, s); };
function popText(str, x, y, color = '#ffe14a', size = 22) {
  popups.push({ text: str, x, y, t: 0, life: 0.8, color, size, rot: (Math.random() - 0.5) * 0.4 });
}
function addBurst(x, y, r) { bursts.push({ x, y, t: 0, r }); }
function resetJuice() { shakeAmt = 0; freezeT = 0; flashA = 0; popups.length = 0; bursts.length = 0; }
function updateJuice(dt) {
  shakeAmt = Math.max(0, shakeAmt - 45 * dt);
  flashA = Math.max(0, flashA - 3 * dt);
  for (const arr of [popups, bursts])
    for (let i = arr.length - 1; i >= 0; i--) { arr[i].t += dt; if (arr[i].t > (arr[i].life || 0.14)) arr.splice(i, 1); }
}
// Camera offset for this frame (call inside a ctx.save()).
function applyShake() {
  if (shakeAmt > 0.3) ctx.translate(Math.round((Math.random() - 0.5) * 2 * shakeAmt), Math.round((Math.random() - 0.5) * 2 * shakeAmt));
}
function drawJuice() {
  for (const b of bursts) {                      // yellow/orange comic star, shrinking
    const k = 1 - b.t / 0.14, r = b.r * (0.6 + 0.6 * k);
    for (const [rr, col] of [[r, '#ff5a3c'], [r * 0.65, '#ffe14a']]) {
      ctx.fillStyle = col; ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2, rad = i % 2 ? rr * 0.5 : rr;
        ctx.lineTo(Math.round(b.x + Math.cos(a) * rad), Math.round(b.y + Math.sin(a) * rad));
      }
      ctx.closePath(); ctx.fill();
    }
  }
  for (const p of popups) {                      // comic text: overshoot in, float up, fade out
    const k = p.t / p.life, sc = p.t < 0.1 ? 0.4 + 9 * p.t * 1.2 : 1;
    ctx.save(); ctx.globalAlpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;
    ctx.translate(Math.round(p.x), Math.round(p.y - k * 28)); ctx.rotate(p.rot); ctx.scale(sc, sc);
    ctx.font = `bold ${p.size}px "Courier New", monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}
function drawFlash() { if (flashA > 0) rect(0, 0, W, H, `rgba(255,255,255,${Math.min(0.8, flashA)})`); }

// ---------------------------------------------------------------------
// 6. The CYBERCHUNK: an ugly, angular steel pickup (parody of a certain famous truck).
//    Health 0..maxHp maps to 4 damage stages:
//      0 pristine · 1 cracked windows (first hit) · 2 dents · 3 panels fall off · 4 collapsed + smoking battery
// ---------------------------------------------------------------------
const truck = {
  x: 420, maxHp: 100, hp: 100,
  stage: 0, wobble: 0, collapse: 0,   // collapse animates 0→1 when destroyed
  tilt: 0,                             // radians; >0 lifts the nose (used by the jiu-jitsu slam)
  dents: [], smoke: [], t: 0,
  halfW: 110,                          // half width, used for hit range checks
  reset() {
    this.hp = this.maxHp; this.stage = 0; this.wobble = 0; this.collapse = 0;
    this.dents.length = 0; this.smoke.length = 0; this.t = 0; this.tilt = 0;
  },
  get destroyed() { return this.hp <= 0; },
  // Which stage a given hp fraction corresponds to.
  stageFor(hp) {
    if (hp <= 0) return 4;
    const f = hp / this.maxHp;
    if (f <= 0.34) return 3;
    if (f <= 0.67) return 2;
    if (f < 1) return 1;
    return 0;
  },
  // Apply damage; returns the actual damage dealt. Triggers stage transition effects.
  hit(amount) {
    if (this.destroyed) return 0;
    const dealt = Math.min(this.hp, amount);
    this.hp -= dealt;
    this.wobble = 1;
    // every hit leaves a dent on the body (drawn once stage >= 2)
    this.dents.push({ x: -90 + Math.random() * 180, y: -62 + Math.random() * 36, r: 5 + Math.random() * 7 });
    const next = this.stageFor(this.hp);
    while (this.stage < next) { this.stage++; this.onStage(this.stage); }
    return dealt;
  },
  // One-off effects when a new damage stage is reached.
  onStage(st) {
    const cx = this.x, by = GROUND_Y + 14;
    // Big moments: a heavy freeze, shake and a comic caption per damage stage
    const caps = ['', 'SHATTERPROOF?!', 'DENTED!', 'RECALL!', 'TOTALED!'];
    Sound.stage(st);
    addShake([0, 6, 8, 12, 18][st]); addFreeze([0, 0.1, 0.12, 0.16, 0.3][st]);
    popText(caps[st], cx, by - 100, st === 3 ? '#ff5a3c' : st === 4 ? '#ffe14a' : '#8fd3ff', st >= 3 ? 30 : 24);
    if (st === 4) { flashA = 0.7; addBurst(cx, by - 40, 60); }
    if (st === 1) {           // the famous "unbreakable" window demo… breaks
      for (let i = 0; i < 14; i++)
        spawnDebris(cx - 30 + Math.random() * 90, by - 55, (Math.random() - 0.5) * 220, -Math.random() * 260, 4, 4, '#bfe9ff', 2.2);
    } else if (st === 3) {    // doors, hood and bed panel fly off
      const cols = ['#9aa1a9', '#8b929a', '#aab0b8'];
      for (let i = 0; i < 4; i++)
        spawnDebris(cx - 60 + i * 35, by - 40, (i < 2 ? -1 : 1) * (80 + Math.random() * 160), -260 - Math.random() * 120, 30, 22, cols[i % 3], -1);
    } else if (st === 4) {    // frame collapses into a pile
      for (let i = 0; i < 12; i++)
        spawnDebris(cx + (Math.random() - 0.5) * 200, by - 40, (Math.random() - 0.5) * 300, -200 - Math.random() * 200, 6 + Math.random() * 10, 5 + Math.random() * 6, '#8b929a', -1);
    }
  },
  update(dt) {
    this.t += dt;
    this.wobble = Math.max(0, this.wobble - dt * 5);
    if (this.stage === 4) this.collapse = Math.min(1, this.collapse + dt * 3);
    // smoking battery: puffs rise once collapsed
    if (this.stage === 4 && this.collapse > 0.5 && Math.random() < dt * 14)
      this.smoke.push({ x: this.x + 30 + Math.random() * 20, y: GROUND_Y - 8, r: 4, age: 0 });
    for (let i = this.smoke.length - 1; i >= 0; i--) {
      const s = this.smoke[i]; s.age += dt; s.y -= 28 * dt; s.x += Math.sin(s.age * 3 + i) * 8 * dt; s.r += 5 * dt;
      if (s.age > 3) this.smoke.splice(i, 1);
    }
  },
  // Draw the truck in local coords: origin at the bottom-center, +x to the right, nose points LEFT.
  draw() {
    const st = this.stage, c = this.collapse;
    const shake = this.wobble * Math.sin(this.t * 60) * 3;
    ctx.save();
    ctx.translate(Math.round(this.x + shake), GROUND_Y + 14);
    if (this.tilt) { ctx.translate(100, 0); ctx.rotate(this.tilt); ctx.translate(-100, 0); }   // pivot on the rear wheels
    if (st === 4) ctx.scale(1, 1 - 0.62 * c);      // squash into a pile
    // --- wheels (behind body) ---
    const flat = st === 4 ? c : 0;
    for (const wx of [-68, 66]) {
      ctx.fillStyle = '#15171b'; ctx.fillRect(wx - 16, -32 + flat * 18, 32, 32 - flat * 18);
      ctx.fillStyle = '#6a7079'; ctx.fillRect(wx - 7, -23 + flat * 12, 14, 14 - flat * 12);
    }
    // --- main body polygon: low nose, steep windshield, roof, long sloped rear ---
    const body = [[-110, -26], [-104, -40], [-62, -46], [-12, -76], [56, -74], [112, -48], [112, -20], [-110, -20]];
    const frameOnly = st >= 3;          // doors/hood gone: draw the bare frame instead of solid panels
    ctx.beginPath(); ctx.moveTo(body[0][0], body[0][1]);
    for (const [px, py] of body.slice(1)) ctx.lineTo(px, py);
    ctx.closePath();
    ctx.fillStyle = frameOnly ? '#3b4048' : '#a9afb7'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#2c3036'; ctx.stroke();
    if (!frameOnly) {
      // flat facets give the harsh angular look
      ctx.fillStyle = '#c9ced4';
      ctx.beginPath(); ctx.moveTo(-62, -46); ctx.lineTo(-12, -76); ctx.lineTo(56, -74); ctx.lineTo(30, -44); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8b9199'; ctx.fillRect(-108, -34, 218, 10);       // lower rocker shade
      // door seams + handles
      ctx.fillStyle = '#2c3036'; ctx.fillRect(-14, -48, 2, 26); ctx.fillRect(40, -48, 2, 26);
      ctx.fillStyle = '#e8eaed'; ctx.fillRect(-26, -40, 8, 3); ctx.fillRect(28, -40, 8, 3);
    } else {
      // exposed frame bars where panels used to be
      ctx.fillStyle = '#6b727b';
      for (let i = 0; i < 5; i++) ctx.fillRect(-90 + i * 46, -46, 5, 26);
      ctx.fillRect(-104, -36, 214, 4);
    }
    // --- windows (stage 0 clean · 1+ cracked · 3+ shattered out) ---
    if (st < 3) {
      const win = [[-56, -48], [-14, -72], [54, -71], [90, -50]];
      ctx.beginPath(); ctx.moveTo(win[0][0], win[0][1]);
      for (const [px, py] of win.slice(1)) ctx.lineTo(px, py);
      ctx.closePath(); ctx.fillStyle = st === 0 ? '#2a3b52' : '#3b5069'; ctx.fill();
      if (st === 0) { ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-30, -66, 14, 3); }
      else {                           // spiderweb cracks from the impact point
        ctx.strokeStyle = '#e6f4ff'; ctx.lineWidth = 1.5; ctx.beginPath();
        const cr = [[12, -60, -20, -52], [12, -60, 40, -70], [12, -60, 30, -50], [12, -60, 0, -72], [12, -60, 60, -58],
                    [12, -60, -40, -56], [-20, -52, -30, -50], [40, -70, 52, -68]];
        for (const [x1, y1, x2, y2] of cr) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
        ctx.stroke();
      }
    }
    // --- dents (stage 2+): dark crater with a bright rim ---
    if (st >= 2 && st < 3) {
      for (const d of this.dents) {
        ctx.fillStyle = 'rgba(40,44,52,.55)'; ctx.fillRect(d.x - d.r, d.y - d.r * 0.6, d.r * 2, d.r * 1.2);
        ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(d.x - d.r, d.y - d.r * 0.6, d.r * 2, 2);
      }
    }
    // --- lights ---
    if (st < 4) { ctx.fillStyle = '#fff6a8'; ctx.fillRect(-110, -33, 6, 4); ctx.fillStyle = '#ff3b3b'; ctx.fillRect(108, -38, 4, 8); }
    // --- smoking battery pack (stage 4) ---
    if (st === 4) {
      ctx.fillStyle = '#20242a'; ctx.fillRect(10, -46, 70, 26 / Math.max(0.4, 1 - 0.62 * c));
      ctx.fillStyle = '#ffd23a'; ctx.fillRect(18, -44, 8, 4); ctx.fillRect(34, -44, 8, 4);   // warning stripes
      if (Math.floor(this.t * 8) % 2) { ctx.fillStyle = '#ff7a1a'; ctx.fillRect(52, -50, 4, 4); }  // spark
    }
    ctx.restore();
    // smoke is drawn in screen space
    for (const s of this.smoke) {
      ctx.globalAlpha = Math.max(0, 0.6 - s.age / 5);
      ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(Math.round(s.x), Math.round(s.y), s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
};

// ---------------------------------------------------------------------
// 8. The fighter: movement, punch / kick attacks and hit detection
// ---------------------------------------------------------------------
// Tunable combat numbers. Damage is in "truck health units" (truck has 100).
const MOVES = {
  //          startup  active  recover  damage  reach(px from fighter x to truck nose)
  punch: { startup: 0.06, active: 0.08, recover: 0.12, dmg: 1.0, reach: 34 },
  kick:  { startup: 0.12, active: 0.10, recover: 0.20, dmg: 1.5, reach: 56 },   // slower, longer, 1.5x
};
const SCORE_PER_DAMAGE = 100;      // points = damage dealt * 100
const MOVE_SPEED = 130;            // px / second
const BUFFER_TIME = 0.12;          // an attack pressed this early before recovery ends still fires


const fighter = {
  x: 120, facing: 1,                 // always faces the truck (right)
  look: CHARACTERS[0].look,
  walkT: 0, moving: false,
  attack: null,                      // {type, t, hitDone} while attacking
  buffered: null, bufferT: 0,
  hits: 0, score: 0, celebrate: false,
  sp: null, cooldown: 0, tooFar: 0,   // active special {def,t,hitIdx,id}; cooldown seconds left; 'too far' message timer
  reset(x) {
    this.x = x; this.walkT = 0; this.moving = false; this.attack = null;
    this.buffered = null; this.bufferT = 0; this.hits = 0; this.score = 0; this.celebrate = false;
    this.sp = null; this.cooldown = 0; this.tooFar = 0;
  },
  // Distance (px) from the fighter to the truck's nose; the hit range check uses this.
  distToTruck() { return (truck.x - truck.halfW) - this.x; },
  // Total duration of the current attack
  attackLen(a) { const m = MOVES[a.type]; return m.startup + m.active + m.recover; },
  startAttack(type) { this.attack = { type, t: 0, hitDone: false }; },
  // Called from update with the player's intent. `canAct` is false while the round is not live.
  update(dt, canAct) {
    // --- buffer attack presses so mashing feels responsive ---
    if (canAct) {
      if (pressed.punch) { this.buffered = 'punch'; this.bufferT = BUFFER_TIME; }
      if (pressed.kick)  { this.buffered = 'kick';  this.bufferT = BUFFER_TIME; }
    }
    this.bufferT -= dt; if (this.bufferT <= 0) this.buffered = null;
    this.tooFar = Math.max(0, this.tooFar - dt);

    // --- special move (L): needs a ready meter, a free fighter, and (for melee specials) being close enough ---
    if (canAct && pressed.special && !this.attack && !this.sp && this.cooldown <= 0) {
      const def = SPECIALS[currentChar.id];
      if (this.distToTruck() <= def.reach) { this.sp = { def, t: 0, hitIdx: 0 }; this.slideFrom = this.x; this.buffered = null; onSpecialStart(def); }
      else this.tooFar = 0.8;
    }
    if (this.sp) {
      const sp = this.sp; sp.t += dt;
      if (sp.def.update) sp.def.update(this, sp.t);
      while (sp.hitIdx < sp.def.hits.length && sp.t >= sp.def.hits[sp.hitIdx].t) this.specialHit(sp.def.hits[sp.hitIdx++].dmg);
      if (sp.t >= sp.def.dur) { this.sp = null; this.cooldown = SPECIAL_COOLDOWN; truck.tilt = 0; }
    } else this.cooldown = Math.max(0, this.cooldown - dt);

    if (this.attack) {
      const a = this.attack, m = MOVES[a.type];
      a.t += dt;
      // The hit lands once, the first frame the active window opens.
      if (!a.hitDone && a.t >= m.startup) { a.hitDone = true; this.resolveHit(a.type); }
      if (a.t >= this.attackLen(a)) this.attack = null;
    }
    if (!this.attack && !this.sp && this.buffered && canAct) { this.startAttack(this.buffered); this.buffered = null; }

    // --- walking (not while swinging; keeps attacks committal) ---
    this.moving = false;
    if (!this.attack && !this.sp && canAct) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dir) { this.x += dir * MOVE_SPEED * dt; this.moving = true; this.walkT += dt * 12; }
    }
    // Stay on the dock and never walk through the truck's nose.
    this.x = Math.max(30, Math.min(truck.x - truck.halfW - 4, this.x));
  },
  // Range check + apply damage. Returns true if the truck was hit.
  resolveHit(type) {
    const m = MOVES[type];
    if (truck.destroyed || this.distToTruck() > m.reach) { Sound.whiff(); return false; }   // whiff: out of range
    const dealt = truck.hit(m.dmg);
    this.hits++; this.score += Math.round(dealt * SCORE_PER_DAMAGE);
    onTruckHit(type, dealt, this.x + this.facing * m.reach, GROUND_Y - 26);
    return true;
  },
  // Damage event from a special move (always lands; the reach check happened when it started).
  specialHit(dmg) {
    if (truck.destroyed) return;
    const dealt = truck.hit(dmg);
    this.hits++; this.score += Math.round(dealt * SCORE_PER_DAMAGE);
    onTruckHit('special', dealt, noseX() + 24, GROUND_Y - 26);
  },
  // Normalized 0..1 extension of the limb: ramps up during startup, held while active, eases back in recovery.
  extension() {
    const a = this.attack; if (!a) return 0;
    const m = MOVES[a.type];
    if (a.t < m.startup) return a.t / m.startup;
    if (a.t < m.startup + m.active) return 1;
    return Math.max(0, 1 - (a.t - m.startup - m.active) / m.recover);
  },
  // Chibi body: big head, small torso, stubby limbs. Origin = feet center.
  // `o` lets the select screen draw idle previews: {x, y, scale, look, celebrate}.
  draw(o = {}) {
    const preview = 'look' in o;
    const L = o.look || this.look, ext = preview ? 0 : this.extension();
    const kicking = !preview && this.attack && this.attack.type === 'kick';
    const punching = !preview && this.attack && this.attack.type === 'punch';
    const moving = !preview && this.moving;
    const sp = !preview && this.sp;
    const celebrate = preview ? !!o.celebrate : this.celebrate;
    const bob = moving ? Math.abs(Math.sin(this.walkT)) * 2 : Math.sin(bgTime * 4) * 0.8;
    const hop = celebrate ? Math.abs(Math.sin(bgTime * 8)) * 10 : 0;   // victory hop
    ctx.save();
    ctx.translate(Math.round(o.x ?? this.x), o.y ?? GROUND_Y + 14);
    if (o.scale) ctx.scale(o.scale, o.scale);
    // ground shadow
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(-16, -2, 32, 4);
    ctx.translate(0, -hop);
    const sw = moving ? Math.sin(this.walkT) * 5 : 0;      // leg swing while walking
    // --- back leg & front leg (kick uses the front leg) ---
    ctx.lineWidth = 6; ctx.lineCap = 'butt';
    ctx.strokeStyle = L.pants;
    ctx.beginPath(); ctx.moveTo(-3, -16 - bob); ctx.lineTo(-3 - sw, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -16 - bob);
    if (kicking) ctx.lineTo(4 + ext * (MOVES.kick.reach - 8), -16 - ext * 12);
    else ctx.lineTo(4 + sw, -2);
    ctx.stroke();
    // shoes
    ctx.fillStyle = L.shoes;
    ctx.fillRect(-8 - sw, -4, 9, 4);
    if (kicking) ctx.fillRect(4 + ext * (MOVES.kick.reach - 8) - 2, -16 - ext * 12 - 4, 9, 8);
    else ctx.fillRect(1 + sw, -4, 9, 4);
    // --- torso ---
    ctx.fillStyle = L.shirt; ctx.fillRect(-9, -32 - bob, 18, 18);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(-9, -18 - bob, 18, 4);
    if (L.torso) L.torso(-bob);       // character-specific details (tie, jacket…)
    // --- back arm (swings opposite to legs) ---
    ctx.strokeStyle = L.shirt; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-8, -29 - bob); ctx.lineTo(-10 + sw * 0.6, -17 - bob); ctx.stroke();
    ctx.fillStyle = L.skin; ctx.fillRect(-13 + sw * 0.6, -19 - bob, 6, 6);
    // --- head (oversized) ---
    ctx.fillStyle = L.skin; ctx.fillRect(-14, -58 - bob, 28, 26);
    ctx.fillStyle = L.hair; ctx.fillRect(-15, -60 - bob, 30, 8); ctx.fillRect(-15, -60 - bob, 6, 18);
    // eyes look toward the truck; squint while attacking
    ctx.fillStyle = '#fff'; ctx.fillRect(2, -49 - bob, 8, 7); ctx.fillRect(-9, -49 - bob, 7, 7);
    ctx.fillStyle = '#000'; ctx.fillRect(6, -47 - bob, 4, 4); ctx.fillRect(-5, -47 - bob, 4, 4);
    ctx.fillRect(-3, -38 - bob, 10, 2);                          // mouth
    if (!preview && this.attack) ctx.fillRect(-4, -39 - bob, 12, 4);          // yelling
    if (L.head) L.head(-bob);        // character-specific hair/accessories
    // --- front arm: the punching arm extends toward the truck ---
    ctx.strokeStyle = L.shirt; ctx.lineWidth = 5;
    const fx = punching ? 10 + ext * (MOVES.punch.reach - 10) : 12;
    const fy = punching ? -27 - bob : -18 - bob;
    if (sp) sp.def.arms(this, sp.t, bob, L);                       // special moves pose their own arms
    else {
      ctx.beginPath(); ctx.moveTo(8, -29 - bob); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = L.skin; ctx.fillRect(fx - 2, fy - 4, 8, 8);   // fist
    }
    if (celebrate) {                                          // both arms up in triumph
      ctx.strokeStyle = L.shirt; ctx.lineWidth = 5;
      for (const sx of [-8, 8]) {
        ctx.beginPath(); ctx.moveTo(sx, -29 - bob); ctx.lineTo(sx * 2.5, -50 - bob); ctx.stroke();
        ctx.fillStyle = L.skin; ctx.fillRect(sx * 2.5 - 3, -54 - bob, 7, 7);
      }
    }
    ctx.restore();
  },
};

// ---------------------------------------------------------------------
// 8b. Special moves. One scripted move per fighter, worth 3x a punch (3 damage), used with L.
//     A move is a timeline over `dur` seconds:
//       reach   max distance (px) from the truck nose at which it can be triggered (Infinity = anywhere)
//       hits    [{t, dmg}] damage events, fired once when the timeline passes `t`
//       update  per-frame side effects (sliding the fighter, tilting the truck…)
//       arms    draws the fighter's arms in local coords (replaces the normal front arm)
//       fx      draws world-space effects on top of the scene
//       lowPoly optional: returns 0..1 intensity of the low-poly screen filter
//     The cooldown (3 s, shown as a meter) starts when the animation ends.
// ---------------------------------------------------------------------
const SPECIAL_COOLDOWN = 3;
const lerp = (a, b, k) => a + (b - a) * Math.max(0, Math.min(1, k));
// Chunky limb + hand helpers used by the arm poses (fighter-local coords).
function limb(x0, y0, x1, y1, L, w = 5) {
  ctx.strokeStyle = L.shirt; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.fillStyle = L.skin; ctx.fillRect(x1 - 3, y1 - 3, 7, 7);
}
function glowFist(x, y, r) {
  ctx.fillStyle = 'rgba(80,255,80,.35)'; ctx.beginPath(); ctx.arc(x, y, r + 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#7dff5a'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
// Screen-space anchor of the truck's nose and the fighter's hand, used by several effects.
const noseX = () => truck.x - truck.halfW;
const handY = () => GROUND_Y + 14 - 28;

const SPECIALS = {
  // --- YOU'RE FIRED!: a giant rubber stamp drops on the truck and leaves a red FIRED imprint ---
  tromp: {
    dur: 0.95, reach: Infinity, hits: [{ t: 0.5, dmg: 3 }], shout: "YOU'RE FIRED!", shoutColor: '#ff4a3c',

      if (t < 0.55) { limb(-8, -29 - bob, -16, -56 - bob, L); limb(8, -29 - bob, 16, -56 - bob, L); }   // hands up, summoning

    },

      const x = truck.x - 5;

  muskrat: {
    dur: 0.9, reach: 150, hits: [{ t: 0.35, dmg: 1 }, { t: 0.5, dmg: 1 }, { t: 0.65, dmg: 1 }], shout: 'NOT-A-FLAMETHROWER', shoutColor: '#ffb020',
    arms(f, t, bob, L) {
      limb(8, -29 - bob, 30, -28 - bob, L);

    },

      }
      ctx.fillStyle = 'rgba(255,120,30,.35)'; ctx.beginPath(); ctx.arc(noseX() + 30, y0, 22 + Math.sin(t * 50) * 3, 0, 7); ctx.fill();   // glow at impact

  // --- Metaverse Takedown: lunge, lift, slam; the screen goes low-poly ---
  zuckerbot: {
    dur: 1.0, reach: 70, hits: [{ t: 0.45, dmg: 3 }], shout: 'METAVERSE TAKEDOWN', shoutColor: '#5bd0ff',
    update(f, t) {
      f.x = lerp(f.slideFrom, noseX() - 6, t / 0.15);              // dash up to the truck
      truck.tilt = t < 0.15 ? 0 : t < 0.4 ? lerp(0, 0.2, (t - 0.15) / 0.25) : t < 0.45 ? lerp(0.2, 0, (t - 0.4) / 0.05) : 0;   // lift… SLAM
    },
    arms(f, t, bob, L) { limb(8, -29 - bob, 28, -26 - bob, L); limb(-8, -29 - bob, 24, -20 - bob, L); },
    lowPoly(t) { return t < 0.1 || t > 0.95 ? 0 : Math.min(1, (t - 0.1) / 0.1, (0.95 - t) / 0.1); },
    fx() {},
  },
  // --- AlphaStrike: stop, calculate (percentage overlay), then a perfectly aimed hit ---
  hassabyte: {
    dur: 1.3, reach: Infinity, hits: [{ t: 1.05, dmg: 3 }], shout: 'ALPHASTRIKE', shoutColor: '#4dffa0',
    arms(f, t, bob, L) {

    },
    fx(f, t) {

      const pct = t >= 1.0 ? 100 : Math.min(99, Math.floor((t - 0.05) / 0.95 * 100 + Math.random() * 3));
      ctx.save(); ctx.globalAlpha = t > 1.15 ? Math.max(0, 1 - (t - 1.15) / 0.15) : 1;
      for (const [cx, cy, dx, dy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
        rect(cx, cy, dx * 14, 2 * dy || 2, g); rect(cx, cy, 2, dy * 14, g);     // targeting brackets
        // (rect with negative sizes still draws correctly in canvas)
      }

        for (let i = 0; i < 6; i++) rect(x + 6 + i * 40, y + 20 + Math.sin(t * 20 + i) * 18, 3, 3, g);   // number crunching dots
      } else {
        const cx = noseX() + 30, cy = GROUND_Y - 10;               // locked crosshair
        ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, 14, 0, 7);
        ctx.moveTo(cx - 22, cy); ctx.lineTo(cx + 22, cy); ctx.moveTo(cx, cy - 22); ctx.lineTo(cx, cy + 22); ctx.stroke();
      }
      text(t < 1.0 ? `CALCULATING... ${pct}%` : 'SOLVED  100%', x + w / 2, y - 10, 13, t < 1.0 ? g : '#ff6a6a');

  },
  // --- GPU Overclock: glowing green fists, a blur of rapid punches ---
  hwatt: {
    dur: 0.85, reach: 70, shout: 'GPU OVERCLOCK', shoutColor: '#7dff5a',
    hits: Array.from({ length: 12 }, (_, i) => ({ t: 0.1 + i * 0.055, dmg: 0.25 })),
    update(f, t) { f.x = lerp(f.slideFrom, Math.min(f.slideFrom + 12, noseX() - 10), t / 0.1); },
    arms(f, t, bob, L) {
      const k = Math.floor((t - 0.1) / 0.055), live = t >= 0.1 && t < 0.78;
      const a = live && k % 2 === 0, b = live && k % 2 === 1;      // alternate fists
      const ax = a ? 34 : 12, ay = a ? -30 : -18, bx = b ? 32 : 4, by = b ? -26 : -16;
      limb(-8, -29 - bob, bx, by - bob, L); limb(8, -29 - bob, ax, ay - bob, L);
      glowFist(ax + 1, ay - bob, 6); glowFist(bx + 1, by - bob, 6);

    fx(f, t) {
      ctx.fillStyle = `rgba(80,255,80,${0.18 + 0.1 * Math.sin(t * 40)})`;
      ctx.beginPath(); ctx.arc(f.x, GROUND_Y - 14, 34, 0, 7); ctx.fill();    // overclocked aura
      for (let i = 0; i < 6; i++) rect(f.x + 26 + i * 6, GROUND_Y - 26 + ((i * 7 + t * 90) % 20), 14, 2, 'rgba(125,255,90,.6)');  // speed lines
    },
  },
  // --- AGI Beam: a chat-bubble laser that types out BOOM ---
  oldman: {
    dur: 1.0, reach: Infinity, hits: [{ t: 0.7, dmg: 3 }], shout: 'AGI BEAM', shoutColor: '#b9a6ff',
    arms(f, t, bob, L) { limb(8, -29 - bob, 32, -30 - bob, L); },
    fx(f, t) {
      const x0 = f.x + 36, y0 = handY() - 2;
      if (t > 0.1 && t < 0.7) {
        const p = (t - 0.1) / 0.6, bx = lerp(x0 + 20, noseX() + 20, p);
        ctx.strokeStyle = 'rgba(130,100,255,.8)'; ctx.lineWidth = 3;           // laser line behind the bubble
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(bx, y0); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(bx, y0); ctx.stroke();
        const word = 'BOOM'.slice(0, Math.max(1, Math.floor((t - 0.1) / 0.12)));   // typing animation
        rect(bx - 6, y0 - 14, 66, 26, '#14142b'); rect(bx - 4, y0 - 12, 62, 22, '#fff');   // chat bubble
        rect(bx - 2, y0 + 10, 6, 6, '#fff');                                   // tail

      } else if (t >= 0.7) {                                                   // impact: giant BOOM
        const k = 1 + (t - 0.7) * 3;
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - (t - 0.7) / 0.3); ctx.translate(noseX() + 60, GROUND_Y - 40); ctx.scale(k, k);
        text('BOOM', 0, 0, 34, '#ffe14a', 'center', '#4b2fd1'); ctx.restore();

};

// Low-poly screen filter used by Metaverse Takedown: downsample the frame to an 80x45 grid, then redraw
// every cell as two flat-shaded triangles (diagonal alternates per cell) so the scene looks faceted.
const LP_W = 80, LP_H = 45, LP_CELL = W / LP_W;
const lpCanvas = document.createElement('canvas'); lpCanvas.width = LP_W; lpCanvas.height = LP_H;
const lpCtx = lpCanvas.getContext('2d', { willReadFrequently: true });
function applyLowPoly(amount) {
  lpCtx.drawImage(canvas, 0, 0, LP_W, LP_H);
  const d = lpCtx.getImageData(0, 0, LP_W, LP_H).data;
  const px = (i, j) => { i = Math.min(LP_W - 1, i); j = Math.min(LP_H - 1, j); const o = (j * LP_W + i) * 4; return [d[o], d[o + 1], d[o + 2]]; };
  ctx.save(); ctx.globalAlpha = amount;
  for (let j = 0; j < LP_H; j++) for (let i = 0; i < LP_W; i++) {
    const x = i * LP_CELL, y = j * LP_CELL, c = LP_CELL, flip = (i + j) % 2;
    const a = px(i, j), b = px(i + 1, j + 1), sh = ((i * 7 + j * 13) % 5 - 2) * 3;   // slight facet shimmer
    ctx.fillStyle = `rgb(${a[0] + sh},${a[1] + sh},${a[2] + sh})`;
    ctx.beginPath();
    if (flip) { ctx.moveTo(x, y); ctx.lineTo(x + c, y); ctx.lineTo(x, y + c); }
    else { ctx.moveTo(x, y); ctx.lineTo(x + c, y); ctx.lineTo(x + c, y + c); }
    ctx.fill();
    ctx.fillStyle = `rgb(${b[0] - sh},${b[1] - sh},${b[2] - sh})`;
    ctx.beginPath();
    if (flip) { ctx.moveTo(x + c, y); ctx.lineTo(x + c, y + c); ctx.lineTo(x, y + c); }
    else { ctx.moveTo(x, y); ctx.lineTo(x, y + c); ctx.lineTo(x + c, y + c); }
    ctx.fill();
  }
  ctx.restore();
}

// Shout banner shown above the fighter when a special starts (see drawShout in the HUD code).
let shout = null;   // {text, color, t}
function onSpecialStart(def) { Sound.special(currentChar.id); shout = { text: def.shout, color: def.shoutColor, t: 0 }; }

// Called for every landed hit; all the hit feedback ("juice") hangs off this.
//   type: 'punch' | 'kick' | 'special'; dealt: damage actually applied; (px, py): contact point.
const HIT_WORDS = { punch: ['BONK!', 'POW!', 'THWACK!', 'BAM!'], kick: ['CRUNCH!', 'WHAM!', 'CLANG!', 'KRAK!'], special: ['KA-BOOM!', 'SMASH!', 'BOOM!'] };
let hitCount = 0;
function onTruckHit(type, dealt, px, py) {
  hitCount++;
  const tiny = dealt < 0.5;
  if (tiny) Sound.tick();
  else if (type === 'kick') { Sound.kick(); Sound.crunch(1.2); }
  else if (type === 'special') { Sound.crunch(2); Sound.boom(); }
  else { Sound.punch(); Sound.crunch(); }                               // Hwatt's flurry: lots of small hits, so keep it light
  // camera shake + hit-stop scale with the move's weight
  addShake(tiny ? 1.5 : type === 'kick' ? 5 : type === 'special' ? 8 : 3);
  if (!tiny) addFreeze(type === 'kick' ? 0.055 : type === 'special' ? 0.09 : 0.035);
  // comic word (every hit, except only every 3rd of the tiny ones)
  if (!tiny || hitCount % 3 === 0) {
    const w = HIT_WORDS[type];
    popText(w[Math.floor(Math.random() * w.length)], px + 10 + Math.random() * 30, py - 30 - Math.random() * 20,
            type === 'kick' ? '#ff9a3c' : type === 'special' ? '#ff5ad5' : '#ffe14a', type === 'special' ? 28 : 20);
  }
  if (!tiny) addBurst(px, py, type === 'special' ? 34 : type === 'kick' ? 26 : 20);
  // debris: steel chips and yellow sparks flying off the truck (more for heavier hits)
  const n = tiny ? 3 : type === 'special' ? 16 : type === 'kick' ? 10 : 6;
  const cols = ['#d0d5db', '#8b929a', '#aab0b8', '#ffe14a'];
  for (let i = 0; i < n; i++)
    spawnDebris(px + Math.random() * 10, py, (Math.random() - 0.3) * 260, -80 - Math.random() * 260,
                2 + Math.random() * 4, 2 + Math.random() * 3, cols[i % cols.length], 0.6 + Math.random() * 0.8);
  // later damage stages: dents pop chunks off the body that stay on the floor
  if (truck.stage >= 2 && !tiny)
    for (let i = 0; i < 2; i++) spawnDebris(px, py - 10, (Math.random() - 0.2) * 200, -150 - Math.random() * 120, 8, 6, '#8b929a', -1);
}

// Session-wide best score (kept in memory only, resets on page reload).
let bestScore = 0;

// Gameplay state. A round moves through phases: intro → play → banner → results.
const ROUND_TIME = 40;                 // seconds
const TIME_BONUS_PER_SEC = 1000;
states.game = {
  phase: 'intro', pt: 0,               // current phase and time spent in it
  timeLeft: ROUND_TIME, won: false,
  timeBonus: 0, total: 0, newBest: false,
  menu: 0,                             // results menu cursor (0 retry, 1 change fighter)
  lastBeep: 0,
  enter() {
    truck.reset(); debris.length = 0; fighter.reset(110); fighter.look = currentChar.look; shout = null; resetJuice();
    this.phase = 'intro'; this.pt = 0; this.timeLeft = ROUND_TIME;
    this.won = false; this.timeBonus = 0; this.total = 0; this.newBest = false; this.menu = 0;
    this.readyDone = this.smashDone = false;
  },
  setPhase(p) { this.phase = p; this.pt = 0; },
  // Round ended: tally the score, update the session best, show the banner.
  finish(won) {
    this.won = won;
    won ? Sound.win() : Sound.lose();
    this.timeBonus = won ? Math.round(this.timeLeft * TIME_BONUS_PER_SEC) : 0;
    this.total = fighter.score + this.timeBonus;
    this.newBest = this.total > bestScore;
    if (this.newBest) bestScore = this.total;
    fighter.celebrate = won;
    this.setPhase('banner');
  },
  update(dt) {
    this.pt += dt;
    const live = this.phase === 'play';
    fighter.update(dt, live);
    if (shout && (shout.t += dt) > 1.1) shout = null;
    truck.update(dt); updateDebris(dt); updateJuice(dt);

    if (this.phase === 'intro') {
      if (!this.readyDone) { this.readyDone = true; Sound.ready(); }
      if (!this.smashDone && this.pt > 0.9) { this.smashDone = true; Sound.smash(); }
      if (this.pt > 1.4) this.setPhase('play');
    } else if (live) {
      const before = Math.ceil(this.timeLeft);
      this.timeLeft = Math.max(0, this.timeLeft - dt);
      const after = Math.ceil(this.timeLeft);
      if (after !== before && after <= 5) Sound.beep(after === 0);   // beep every second of the last five; long one at zero
      if (truck.destroyed) this.finish(true);         // PERFECT!
      else if (this.timeLeft <= 0) this.finish(false); // SALE CANCELLED
    } else if (this.phase === 'banner') {
      // banner shows briefly, then the results panel; confirm skips ahead
      if (this.pt > 2.4 || (this.pt > 0.8 && pressed.confirm)) this.setPhase('results');
    } else if (this.phase === 'results') {
      if (pressed.left || pressed.right || pressed.up || pressed.down) { this.menu = 1 - this.menu; Sound.blip(); }
      if (pressed.confirm) {
        Sound.confirm();
        if (this.menu === 0) setState('game');        // retry
        else setState('select');
      }
    }
    if (pressed.back) setState('title');
  },
  draw() {
    ctx.save(); applyShake();                              // camera shake affects the world, not the HUD
    drawBackground();
    // salesman: smug while undamaged, sweating as the truck breaks, panicking when it's wrecked
    const mood = this.phase === 'banner' || this.phase === 'results' ? (this.won ? 2 : 0)
               : truck.stage >= 3 ? 2 : truck.stage >= 1 ? 1 : 0;
    drawSalesman(590, GROUND_Y, mood, truck.t);
    if (this.phase === 'results' || this.phase === 'banner') {
      const line = this.won ? 'MY COMMISSION!!' : 'HA HA HA! NO SALE!';
      text(line, 560, GROUND_Y - 66, 10, this.won ? '#ff6a6a' : '#ffe14a');
    }
    truck.draw(); fighter.draw(); drawDebris(); drawJuice();
    if (fighter.sp) {
      fighter.sp.def.fx(fighter, fighter.sp.t);
      const lp = fighter.sp.def.lowPoly ? fighter.sp.def.lowPoly(fighter.sp.t) : 0;
      if (lp > 0) applyLowPoly(lp);                       // faceted "metaverse" look, under the HUD
    }
    ctx.restore();
    drawFlash();
    this.drawHud();
    if (this.phase === 'intro') this.drawIntro();
    if (this.phase === 'banner') this.drawBanner();
    if (this.phase === 'results') this.drawResults();
  },
  drawHud() {
    drawTruckBar();
    text('SCORE ' + String(fighter.score).padStart(6, '0'), W - 16, 20, 14, '#fff', 'right');
    text(currentChar.name, W - 16, 38, 9, '#8fd3ff', 'right');
    // big centered countdown; flashes red in the final 5 seconds
    const secs = Math.ceil(this.timeLeft), low = this.timeLeft <= 5 && this.phase === 'play';
    const pulse = low ? 1 + 0.15 * Math.abs(Math.sin(this.timeLeft * Math.PI * 2)) : 1;
    ctx.save(); ctx.translate(W / 2, 34); ctx.scale(pulse, pulse);
    text(String(secs).padStart(2, '0'), 0, 0, 46, low ? '#ff3b30' : '#fff', 'center', '#000');
    ctx.restore();
    if (this.phase === 'play') text('A/D MOVE  J PUNCH  K KICK  L SPECIAL', W - 16, H - 26, 10, '#fff', 'right');
    this.drawSpecialMeter();
    if (shout) {                                          // special move shout, punches in then floats up
      const k = shout.t < 0.15 ? 1.8 - 0.8 * (shout.t / 0.15) : 1;
      ctx.save(); ctx.globalAlpha = Math.min(1, (1.1 - shout.t) / 0.3);
      ctx.translate(Math.max(150, Math.min(W - 150, fighter.x + 20)), 120 - shout.t * 20); ctx.scale(k, k);
      text(shout.text, 0, 0, 22, shout.color, 'center', '#000'); ctx.restore();
    }
  },
  // 3-second special cooldown meter (bottom-left). Gold + flashing when ready.
  drawSpecialMeter() {
    const x = 16, y = H - 30, w = 150, h = 10, ready = fighter.cooldown <= 0 && !fighter.sp;
    const f = fighter.sp ? 0 : 1 - fighter.cooldown / SPECIAL_COOLDOWN;
    text('SPECIAL [L]', x, y - 8, 10, '#fff', 'left');
    rect(x - 2, y - 2, w + 4, h + 4, '#000'); rect(x, y, w, h, '#2a2a40');
    rect(x, y, w * f, h, ready ? (Math.floor(bgTime * 8) % 2 ? '#ffe14a' : '#fff1a0') : '#4aa3ff');
    if (ready) text('READY!', x + w + 10, y + 5, 10, '#ffe14a', 'left');
    else if (fighter.tooFar > 0) text('', x, y, 1, '#fff');
    if (fighter.tooFar > 0) text('MOVE CLOSER!', x + w + 10, y + 5, 10, '#ff6a6a', 'left');
  },
  drawIntro() {
    const label = this.pt < 0.9 ? 'READY?' : 'SMASH!';
    const k = this.pt < 0.9 ? 1 : 1 + (this.pt - 0.9) * 2;      // "SMASH!" punches in then grows
    ctx.save(); ctx.translate(W / 2, 150); ctx.scale(k, k);
    text(label, 0, 0, 48, this.pt < 0.9 ? '#ffe14a' : '#ff5a3c', 'center', '#000');
    ctx.restore();
  },
  drawBanner() {
    // slam-in scale animation over the first 0.25 s
    const k = this.pt < 0.25 ? 3 - 2 * (this.pt / 0.25) : 1;
    ctx.save(); ctx.translate(W / 2, 140); ctx.scale(k, k);
    if (this.won) {
      text('PERFECT!', 0, 0, 64, '#ffe14a', 'center', '#b3261e');
      text('TIME BONUS +' + this.timeBonus, 0, 44, 16, '#fff');
    } else {
      text('SALE CANCELLED', 0, 0, 40, '#ff4a3c', 'center', '#000');
      text('"' + currentChar.lose + '"', 0, 40, 13, '#fff');
    }
    ctx.restore();
  },
  drawResults() {
    rect(0, 0, W, H, 'rgba(0,0,0,.55)');
    const x = 150, y = 40, w = 340, h = 280;
    rect(x - 3, y - 3, w + 6, h + 6, '#fff'); rect(x, y, w, h, '#14142b');
    text(this.won ? 'PERFECT!' : 'SALE CANCELLED', W / 2, y + 28, 26, this.won ? '#ffe14a' : '#ff4a3c');
    text(currentChar.name, W / 2, y + 54, 12, '#8fd3ff');
    text('"' + (this.won ? currentChar.win : currentChar.lose) + '"', W / 2, y + 76, 10, '#ddd');
    const rows = [
      ['HITS LANDED', String(fighter.hits)],
      ['TIME REMAINING', this.timeLeft.toFixed(1) + ' s'],
      ['HIT SCORE', String(fighter.score)],
      ['TIME BONUS', '+' + this.timeBonus],
    ];
    rows.forEach((r, i) => {
      text(r[0], x + 24, y + 108 + i * 22, 13, '#fff', 'left', null);
      text(r[1], x + w - 24, y + 108 + i * 22, 13, '#ffe14a', 'right', null);
    });
    rect(x + 20, y + 196, w - 40, 2, '#fff');
    text('TOTAL', x + 24, y + 214, 18, '#fff', 'left');
    text(String(this.total), x + w - 24, y + 214, 18, '#3fd35a', 'right');
    text((this.newBest ? 'NEW BEST! ' : 'BEST ') + bestScore, W / 2, y + 238, 12, this.newBest ? '#ff9ad5' : '#aaa');
    const opts = ['RETRY', 'CHANGE FIGHTER'];
    opts.forEach((o, i) => {
      const sel = this.menu === i;
      text((sel ? '> ' : '  ') + o, x + 40 + i * 150, y + 262, 12, sel ? '#ffe14a' : '#888', 'left', null);
    });
  },
};

// ---------------------------------------------------------------------
// 10. Main loop: fixed 60 Hz update, render every animation frame
// ---------------------------------------------------------------------
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  // clamp big gaps (tab switch) so we don't run a burst of catch-up updates
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (acc >= STEP) {
    bgTime += STEP;
    if (freezeT > 0) freezeT -= STEP;             // hit-stop: skip the simulation, keep queued key presses
    else { state.update(STEP); for (const k in pressed) delete pressed[k]; }   // consume one-shot presses
    acc -= STEP;
  }
  ctx.clearRect(0, 0, W, H);
  state.draw();
  text(Sound.muted ? '[M] SOUND: OFF' : '[M] SOUND: ON', W - 8, H - 8, 9, Sound.muted ? '#ff6a6a' : '#9f9', 'right');
  requestAnimationFrame(frame);
}

setState('title');
requestAnimationFrame(frame);
</script>
</body>
</html>
