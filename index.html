<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CYBER SMASH</title>
<style>
  /* Full-window black stage; the canvas is centered and scaled by JS (see resize()). */
  html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<script>
"use strict";
/* =====================================================================
   CYBER SMASH — a parody "destroy the car" bonus stage.
   Single file, vanilla JS, everything drawn with canvas shapes.
   ===================================================================== */

// ---------------------------------------------------------------------
// 1. Core constants & canvas setup
// ---------------------------------------------------------------------
const W = 640, H = 360;            // logical resolution (16:9), scaled up by CSS
const GROUND_Y = 300;              // y of the dock floor where characters stand
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Scale the canvas to the largest size that fits the window while keeping 16:9.
// Prefer integer multiples when the window is big enough, to keep pixels crisp.
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const scale = s >= 2 ? Math.floor(s * 2) / 2 : s;   // snap to 0.5 steps above 2x
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------
// 2. Input: keyboard state + one-shot "pressed this frame" events
// ---------------------------------------------------------------------
const keys = {};        // currently held keys (by lowercase key name / code)
const pressed = {};     // keys that went down since the last update tick
const KEYMAP = {
  arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right',
  j: 'punch', k: 'kick', l: 'special',
  ' ': 'confirm', enter: 'confirm', m: 'mute', escape: 'back',
  arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down',
};
window.addEventListener('keydown', e => {
  const act = KEYMAP[e.key.toLowerCase()];
  if (!act) return;
  e.preventDefault();
  if (!keys[act]) pressed[act] = true;   // ignore OS key-repeat
  keys[act] = true;
});
window.addEventListener('keyup', e => {
  const act = KEYMAP[e.key.toLowerCase()];
  if (act) keys[act] = false;
});
// Losing focus must not leave keys "stuck".
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------------------------------------------------------------------
// 3. Drawing helpers (chunky pixel-style primitives)
// ---------------------------------------------------------------------
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
// Bitmap-ish text using a bold monospace font; shadow gives the arcade look.
function text(str, x, y, size, color, align = 'center', shadow = '#000') {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, Math.round(x) + 2, Math.round(y) + 2); }
  ctx.fillStyle = color;
  ctx.fillText(str, Math.round(x), Math.round(y));
}

// ---------------------------------------------------------------------
// 4. Harbor background: sky, sea, cargo ships, cranes, crates, dock
// ---------------------------------------------------------------------
function drawCargoShip(x, y, scale, hull) {
  const s = scale;
  rect(x, y, 150 * s, 18 * s, hull);                     // hull
  rect(x - 8 * s, y, 8 * s, 10 * s, hull);               // bow slope (blocky)
  rect(x + 150 * s, y, 6 * s, 10 * s, hull);
  rect(x, y + 12 * s, 150 * s, 3 * s, '#8a1c1c');        // waterline stripe
  // container stacks in bright primary colors
  const cols = ['#d94a2b', '#2b7bd9', '#e8c321', '#3aa655', '#8e44ad'];
  for (let i = 0; i < 6; i++) {
    for (let j = 0; j < 2 + (i % 2); j++) {
      rect(x + 10 * s + i * 22 * s, y - (j + 1) * 12 * s, 20 * s, 11 * s, cols[(i + j) % cols.length]);
    }
  }
  rect(x + 120 * s, y - 30 * s, 24 * s, 30 * s, '#e8e8e8');   // bridge tower
  rect(x + 124 * s, y - 25 * s, 16 * s, 5 * s, '#4aa3df');    // bridge windows
}
function drawCrane(x, y) {
  const c = '#e0a31a';
  rect(x, y, 6, 150, c); rect(x + 24, y, 6, 150, c);          // legs
  rect(x - 40, y, 150, 8, c);                                  // jib
  rect(x + 80, y + 8, 2, 40, '#333');                          // cable
  rect(x + 74, y + 48, 14, 10, '#d94a2b');                     // hanging container
  for (let i = 0; i < 6; i++) rect(x + 6, y + 20 + i * 22, 18, 3, c);   // cross braces
}
function drawCrate(x, y, w, h, color) {
  rect(x, y, w, h, color);
  rect(x, y, w, 3, 'rgba(255,255,255,.25)');
  rect(x + 3, y + 3, w - 6, 2, 'rgba(0,0,0,.35)');             // plank lines
  rect(x + 3, y + h - 5, w - 6, 2, 'rgba(0,0,0,.35)');
  rect(x, y, 3, h, 'rgba(0,0,0,.3)'); rect(x + w - 3, y, 3, h, 'rgba(0,0,0,.3)');
  // diagonal brace
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + w - 4, y + h - 4); ctx.stroke();
}

let bgTime = 0;   // drives the gentle wave/seagull animation
function drawBackground() {
  // sky: banded gradient (retro style) from dusk orange to teal
  const bands = ['#2b1b4d', '#4a2a73', '#8a3f8f', '#d9577a', '#f28a5a', '#ffc16b'];
  for (let i = 0; i < bands.length; i++) rect(0, i * 28, W, 29, bands[i]);
  rect(470, 130, 46, 46, '#fff3b0');                 // chunky sun
  rect(476, 124, 34, 6, '#fff3b0'); rect(476, 176, 34, 6, '#fff3b0');
  // sea
  rect(0, 172, W, 128, '#1b4f8a');
  for (let i = 0; i < 14; i++) {                     // animated wave dashes
    const wx = ((i * 53 + bgTime * 20) % (W + 40)) - 20;
    rect(wx, 185 + (i % 5) * 20, 18, 2, '#3d8fd1');
  }
  // far ships + crane silhouettes
  drawCargoShip(40, 160, 1, '#2a2f3a');
  drawCargoShip(330, 168, 0.8, '#3a2f2a');
  drawCrane(560, 60);
  // seagull
  const gx = (bgTime * 25) % (W + 60) - 30, gy = 70 + Math.sin(bgTime * 2) * 6;
  rect(gx, gy, 6, 2, '#fff'); rect(gx + 6, gy - 2, 6, 2, '#fff'); rect(gx + 12, gy, 6, 2, '#fff');
  // dock: planks + crates
  rect(0, 262, W, 98, '#6b4a2b');
  rect(0, 262, W, 6, '#8a6238');
  for (let i = 0; i < 16; i++) rect(i * 42, 268, 2, 92, '#4a321d');  // plank seams
  rect(0, GROUND_Y + 16, W, 44, '#4a321d');
  drawCrate(10, 226, 40, 40, '#a8742f'); drawCrate(54, 238, 28, 28, '#8f5f26');
  drawCrate(14, 190, 30, 36, '#b8832f');
  drawCrate(590, 230, 44, 36, '#9c6a2a'); drawCrate(560, 244, 28, 22, '#b8832f');
  // bollards along the quay edge
  for (let i = 0; i < 5; i++) { rect(90 + i * 120, 252, 8, 10, '#222'); rect(88 + i * 120, 250, 12, 3, '#555'); }
}

// The shady salesman (right side, watching nervously). `mood` 0=smug, 1=nervous, 2=panic.
function drawSalesman(x, y, mood, t) {
  const sweat = mood > 0 && Math.floor(t * 4) % 2 === 0;
  rect(x - 8, y - 30, 16, 22, '#3b3b6b');            // suit
  rect(x - 2, y - 30, 4, 18, '#e03a3a');             // loud tie
  rect(x - 7, y - 8, 6, 10, '#222'); rect(x + 1, y - 8, 6, 10, '#222');   // legs
  rect(x - 9, y - 46, 18, 16, '#f2c9a0');            // big head
  rect(x - 10, y - 48, 20, 5, '#222');               // slick hair
  rect(x - 6, y - 40, 4, 4, '#fff'); rect(x + 2, y - 40, 4, 4, '#fff');   // eyes
  rect(x - 5 + (mood > 0 ? 1 : 0), y - 39, 2, 2, '#000'); rect(x + 3 + (mood > 0 ? 1 : 0), y - 39, 2, 2, '#000');
  rect(x - 8, y - 43, 5, 1, '#222'); rect(x + 3, y - 43, 5, 1, '#222');   // brows
  if (mood === 2) rect(x - 3, y - 34, 6, 5, '#600'); // mouth agape
  else rect(x - 4, y - 33, 8, 2, mood === 1 ? '#7a3b2e' : '#d9534f');
  if (sweat) rect(x + 10, y - 44, 3, 5, '#7fd4ff');  // sweat drop
  rect(x + 8, y - 24, 12, 8, '#2a7a3a');             // clutching a wad of cash
  text('$', x + 14, y - 20, 8, '#d7f7c2', 'center', null);
}

// ---------------------------------------------------------------------
// 5. Debris: generic flying chunks (glass, panels, sparks). Reused by later juice work.
// ---------------------------------------------------------------------
const debris = [];
// Spawns a chunk: pos, velocity, size, color, spin and lifetime (-1 = stays on the floor forever).
function spawnDebris(x, y, vx, vy, w, h, color, life = 2.5, opts = {}) {
  debris.push({ x, y, vx, vy, w, h, color, life, age: 0, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12,
                grounded: false, shape: opts.shape || 'rect', bounce: opts.bounce ?? 0.35 });
}
function updateDebris(dt) {
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.age += dt;
    if (!d.grounded) {
      d.vy += 900 * dt;                        // gravity
      d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      const floor = GROUND_Y + 14 - d.h / 2;   // rest on the dock surface
      if (d.y > floor) {
        d.y = floor;
        if (Math.abs(d.vy) > 80) { d.vy = -d.vy * d.bounce; d.vx *= 0.7; d.vr *= 0.6; }
        else { d.grounded = true; d.vr = 0; d.vy = 0; }
      }
    }
    if (d.life >= 0 && d.age > d.life) debris.splice(i, 1);
  }
}
function drawDebris() {
  for (const d of debris) {
    // fade out in the last 0.5s of life
    const fade = d.life >= 0 ? Math.min(1, (d.life - d.age) / 0.5) : 1;
    ctx.save(); ctx.globalAlpha = fade;
    ctx.translate(Math.round(d.x), Math.round(d.y)); ctx.rotate(d.rot);
    ctx.fillStyle = d.color;
    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.restore();
  }
}

// ---------------------------------------------------------------------
// 6. The CYBERCHUNK: an ugly, angular steel pickup (parody of a certain famous truck).
//    Health 0..maxHp maps to 4 damage stages:
//      0 pristine · 1 cracked windows (first hit) · 2 dents · 3 panels fall off · 4 collapsed + smoking battery
// ---------------------------------------------------------------------
const truck = {
  x: 420, maxHp: 100, hp: 100,
  stage: 0, wobble: 0, collapse: 0,   // collapse animates 0→1 when destroyed
  dents: [], smoke: [], t: 0,
  halfW: 110,                          // half width, used for hit range checks
  reset() {
    this.hp = this.maxHp; this.stage = 0; this.wobble = 0; this.collapse = 0;
    this.dents.length = 0; this.smoke.length = 0; this.t = 0;
  },
  get destroyed() { return this.hp <= 0; },
  // Which stage a given hp fraction corresponds to.
  stageFor(hp) {
    if (hp <= 0) return 4;
    const f = hp / this.maxHp;
    if (f <= 0.34) return 3;
    if (f <= 0.67) return 2;
    if (f < 1) return 1;
    return 0;
  },
  // Apply damage; returns the actual damage dealt. Triggers stage transition effects.
  hit(amount) {
    if (this.destroyed) return 0;
    const dealt = Math.min(this.hp, amount);
    this.hp -= dealt;
    this.wobble = 1;
    // every hit leaves a dent on the body (drawn once stage >= 2)
    this.dents.push({ x: -90 + Math.random() * 180, y: -62 + Math.random() * 36, r: 5 + Math.random() * 7 });
    const next = this.stageFor(this.hp);
    while (this.stage < next) { this.stage++; this.onStage(this.stage); }
    return dealt;
  },
  // One-off effects when a new damage stage is reached.
  onStage(st) {
    const cx = this.x, by = GROUND_Y + 14;
    if (st === 1) {           // the famous "unbreakable" window demo… breaks
      for (let i = 0; i < 14; i++)
        spawnDebris(cx - 30 + Math.random() * 90, by - 55, (Math.random() - 0.5) * 220, -Math.random() * 260, 4, 4, '#bfe9ff', 2.2);
    } else if (st === 3) {    // doors, hood and bed panel fly off
      const cols = ['#9aa1a9', '#8b929a', '#aab0b8'];
      for (let i = 0; i < 4; i++)
        spawnDebris(cx - 60 + i * 35, by - 40, (i < 2 ? -1 : 1) * (80 + Math.random() * 160), -260 - Math.random() * 120, 30, 22, cols[i % 3], -1);
    } else if (st === 4) {    // frame collapses into a pile
      for (let i = 0; i < 12; i++)
        spawnDebris(cx + (Math.random() - 0.5) * 200, by - 40, (Math.random() - 0.5) * 300, -200 - Math.random() * 200, 6 + Math.random() * 10, 5 + Math.random() * 6, '#8b929a', -1);
    }
  },
  update(dt) {
    this.t += dt;
    this.wobble = Math.max(0, this.wobble - dt * 5);
    if (this.stage === 4) this.collapse = Math.min(1, this.collapse + dt * 3);
    // smoking battery: puffs rise once collapsed
    if (this.stage === 4 && this.collapse > 0.5 && Math.random() < dt * 14)
      this.smoke.push({ x: this.x + 30 + Math.random() * 20, y: GROUND_Y - 8, r: 4, age: 0 });
    for (let i = this.smoke.length - 1; i >= 0; i--) {
      const s = this.smoke[i]; s.age += dt; s.y -= 28 * dt; s.x += Math.sin(s.age * 3 + i) * 8 * dt; s.r += 5 * dt;
      if (s.age > 3) this.smoke.splice(i, 1);
    }
  },
  // Draw the truck in local coords: origin at the bottom-center, +x to the right, nose points LEFT.
  draw() {
    const st = this.stage, c = this.collapse;
    const shake = this.wobble * Math.sin(this.t * 60) * 3;
    ctx.save();
    ctx.translate(Math.round(this.x + shake), GROUND_Y + 14);
    if (st === 4) ctx.scale(1, 1 - 0.62 * c);      // squash into a pile
    // --- wheels (behind body) ---
    const flat = st === 4 ? c : 0;
    for (const wx of [-68, 66]) {
      ctx.fillStyle = '#15171b'; ctx.fillRect(wx - 16, -32 + flat * 18, 32, 32 - flat * 18);
      ctx.fillStyle = '#6a7079'; ctx.fillRect(wx - 7, -23 + flat * 12, 14, 14 - flat * 12);
    }
    // --- main body polygon: low nose, steep windshield, roof, long sloped rear ---
    const body = [[-110, -26], [-104, -40], [-62, -46], [-12, -76], [56, -74], [112, -48], [112, -20], [-110, -20]];
    const frameOnly = st >= 3;          // doors/hood gone: draw the bare frame instead of solid panels
    ctx.beginPath(); ctx.moveTo(body[0][0], body[0][1]);
    for (const [px, py] of body.slice(1)) ctx.lineTo(px, py);
    ctx.closePath();
    ctx.fillStyle = frameOnly ? '#3b4048' : '#a9afb7'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#2c3036'; ctx.stroke();
    if (!frameOnly) {
      // flat facets give the harsh angular look
      ctx.fillStyle = '#c9ced4';
      ctx.beginPath(); ctx.moveTo(-62, -46); ctx.lineTo(-12, -76); ctx.lineTo(56, -74); ctx.lineTo(30, -44); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8b9199'; ctx.fillRect(-108, -34, 218, 10);       // lower rocker shade
      // door seams + handles
      ctx.fillStyle = '#2c3036'; ctx.fillRect(-14, -48, 2, 26); ctx.fillRect(40, -48, 2, 26);
      ctx.fillStyle = '#e8eaed'; ctx.fillRect(-26, -40, 8, 3); ctx.fillRect(28, -40, 8, 3);
    } else {
      // exposed frame bars where panels used to be
      ctx.fillStyle = '#6b727b';
      for (let i = 0; i < 5; i++) ctx.fillRect(-90 + i * 46, -46, 5, 26);
      ctx.fillRect(-104, -36, 214, 4);
    }
    // --- windows (stage 0 clean · 1+ cracked · 3+ shattered out) ---
    if (st < 3) {
      const win = [[-56, -48], [-14, -72], [54, -71], [90, -50]];
      ctx.beginPath(); ctx.moveTo(win[0][0], win[0][1]);
      for (const [px, py] of win.slice(1)) ctx.lineTo(px, py);
      ctx.closePath(); ctx.fillStyle = st === 0 ? '#2a3b52' : '#3b5069'; ctx.fill();
      if (st === 0) { ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-30, -66, 14, 3); }
      else {                           // spiderweb cracks from the impact point
        ctx.strokeStyle = '#e6f4ff'; ctx.lineWidth = 1.5; ctx.beginPath();
        const cr = [[12, -60, -20, -52], [12, -60, 40, -70], [12, -60, 30, -50], [12, -60, 0, -72], [12, -60, 60, -58],
                    [12, -60, -40, -56], [-20, -52, -30, -50], [40, -70, 52, -68]];
        for (const [x1, y1, x2, y2] of cr) { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); }
        ctx.stroke();
      }
    }
    // --- dents (stage 2+): dark crater with a bright rim ---
    if (st >= 2 && st < 3) {
      for (const d of this.dents) {
        ctx.fillStyle = 'rgba(40,44,52,.55)'; ctx.fillRect(d.x - d.r, d.y - d.r * 0.6, d.r * 2, d.r * 1.2);
        ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(d.x - d.r, d.y - d.r * 0.6, d.r * 2, 2);
      }
    }
    // --- lights ---
    if (st < 4) { ctx.fillStyle = '#fff6a8'; ctx.fillRect(-110, -33, 6, 4); ctx.fillStyle = '#ff3b3b'; ctx.fillRect(108, -38, 4, 8); }
    // --- smoking battery pack (stage 4) ---
    if (st === 4) {
      ctx.fillStyle = '#20242a'; ctx.fillRect(10, -46, 70, 26 / Math.max(0.4, 1 - 0.62 * c));
      ctx.fillStyle = '#ffd23a'; ctx.fillRect(18, -44, 8, 4); ctx.fillRect(34, -44, 8, 4);   // warning stripes
      if (Math.floor(this.t * 8) % 2) { ctx.fillStyle = '#ff7a1a'; ctx.fillRect(52, -50, 4, 4); }  // spark
    }
    ctx.restore();
    // smoke is drawn in screen space
    for (const s of this.smoke) {
      ctx.globalAlpha = Math.max(0, 0.6 - s.age / 5);
      ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(Math.round(s.x), Math.round(s.y), s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  },
};

// Health bar with the truck name (top-left). Color shifts green→yellow→red.
function drawTruckBar() {
  const x = 16, y = 14, w = 220, h = 14, f = Math.max(0, truck.hp / truck.maxHp);
  text('CYBERCHUNK', x, y - 1, 10, '#fff', 'left');
  rect(x - 2, y + 7, w + 4, h + 4, '#000');
  rect(x, y + 9, w, h, '#3a1111');
  rect(x, y + 9, w * f, h, f > 0.6 ? '#3fd35a' : f > 0.3 ? '#f2c21b' : '#e5352b');
  rect(x, y + 9, w * f, 3, 'rgba(255,255,255,.35)');        // glossy highlight
  for (let i = 1; i < 4; i++) rect(x + (w * i) / 4 - 1, y + 9, 2, h, 'rgba(0,0,0,.5)');  // stage ticks
}

// ---------------------------------------------------------------------
// 7. The fighter: movement, punch / kick attacks and hit detection
// ---------------------------------------------------------------------
// Tunable combat numbers. Damage is in "truck health units" (truck has 100).
const MOVES = {
  //          startup  active  recover  damage  reach(px from fighter x to truck nose)
  punch: { startup: 0.06, active: 0.08, recover: 0.12, dmg: 1.0, reach: 34 },
  kick:  { startup: 0.12, active: 0.10, recover: 0.20, dmg: 1.5, reach: 56 },   // slower, longer, 1.5x
};
const SCORE_PER_DAMAGE = 100;      // points = damage dealt * 100
const MOVE_SPEED = 130;            // px / second
const BUFFER_TIME = 0.12;          // an attack pressed this early before recovery ends still fires

// Default look; the character-select PR replaces this with six caricatures.
const DEFAULT_LOOK = { skin: '#f2c9a0', hair: '#5a3a1a', shirt: '#2f6fd1', pants: '#2a2f4a', shoes: '#e8e8e8', head: null };

const fighter = {
  x: 120, facing: 1,                 // always faces the truck (right)
  look: DEFAULT_LOOK,
  walkT: 0, moving: false,
  attack: null,                      // {type, t, hitDone} while attacking
  buffered: null, bufferT: 0,
  hits: 0, score: 0,
  reset(x) {
    this.x = x; this.walkT = 0; this.moving = false; this.attack = null;
    this.buffered = null; this.bufferT = 0; this.hits = 0; this.score = 0;
  },
  // Distance (px) from the fighter to the truck's nose; the hit range check uses this.
  distToTruck() { return (truck.x - truck.halfW) - this.x; },
  // Total duration of the current attack
  attackLen(a) { const m = MOVES[a.type]; return m.startup + m.active + m.recover; },
  startAttack(type) { this.attack = { type, t: 0, hitDone: false }; },
  // Called from update with the player's intent. `canAct` is false while the round is not live.
  update(dt, canAct) {
    // --- buffer attack presses so mashing feels responsive ---
    if (canAct) {
      if (pressed.punch) { this.buffered = 'punch'; this.bufferT = BUFFER_TIME; }
      if (pressed.kick)  { this.buffered = 'kick';  this.bufferT = BUFFER_TIME; }
    }
    this.bufferT -= dt; if (this.bufferT <= 0) this.buffered = null;

    if (this.attack) {
      const a = this.attack, m = MOVES[a.type];
      a.t += dt;
      // The hit lands once, the first frame the active window opens.
      if (!a.hitDone && a.t >= m.startup) { a.hitDone = true; this.resolveHit(a.type); }
      if (a.t >= this.attackLen(a)) this.attack = null;
    }
    if (!this.attack && this.buffered && canAct) { this.startAttack(this.buffered); this.buffered = null; }

    // --- walking (not while swinging; keeps attacks committal) ---
    this.moving = false;
    if (!this.attack && canAct) {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dir) { this.x += dir * MOVE_SPEED * dt; this.moving = true; this.walkT += dt * 12; }
    }
    // Stay on the dock and never walk through the truck's nose.
    this.x = Math.max(30, Math.min(truck.x - truck.halfW - 4, this.x));
  },
  // Range check + apply damage. Returns true if the truck was hit.
  resolveHit(type) {
    const m = MOVES[type];
    if (truck.destroyed || this.distToTruck() > m.reach) return false;   // whiff: out of range
    const dealt = truck.hit(m.dmg);
    this.hits++; this.score += Math.round(dealt * SCORE_PER_DAMAGE);
    onTruckHit(type, dealt, this.x + this.facing * m.reach, GROUND_Y - 26);
    return true;
  },
  // Normalized 0..1 extension of the limb: ramps up during startup, held while active, eases back in recovery.
  extension() {
    const a = this.attack; if (!a) return 0;
    const m = MOVES[a.type];
    if (a.t < m.startup) return a.t / m.startup;
    if (a.t < m.startup + m.active) return 1;
    return Math.max(0, 1 - (a.t - m.startup - m.active) / m.recover);
  },
  // Chibi body: big head, small torso, stubby limbs. Origin = feet center.
  draw() {
    const L = this.look, ext = this.extension();
    const kicking = this.attack && this.attack.type === 'kick';
    const punching = this.attack && this.attack.type === 'punch';
    const bob = this.moving ? Math.abs(Math.sin(this.walkT)) * 2 : Math.sin(truck.t * 4) * 0.8;
    ctx.save();
    ctx.translate(Math.round(this.x), GROUND_Y + 14);
    // ground shadow
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(-16, -2, 32, 4);
    const sw = this.moving ? Math.sin(this.walkT) * 5 : 0;      // leg swing while walking
    // --- back leg & front leg (kick uses the front leg) ---
    ctx.lineWidth = 6; ctx.lineCap = 'butt';
    ctx.strokeStyle = L.pants;
    ctx.beginPath(); ctx.moveTo(-3, -16 - bob); ctx.lineTo(-3 - sw, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, -16 - bob);
    if (kicking) ctx.lineTo(4 + ext * (MOVES.kick.reach - 8), -16 - ext * 12);
    else ctx.lineTo(4 + sw, -2);
    ctx.stroke();
    // shoes
    ctx.fillStyle = L.shoes;
    ctx.fillRect(-8 - sw, -4, 9, 4);
    if (kicking) ctx.fillRect(4 + ext * (MOVES.kick.reach - 8) - 2, -16 - ext * 12 - 4, 9, 8);
    else ctx.fillRect(1 + sw, -4, 9, 4);
    // --- torso ---
    ctx.fillStyle = L.shirt; ctx.fillRect(-9, -32 - bob, 18, 18);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(-9, -18 - bob, 18, 4);
    if (L.torso) L.torso(ctx, -bob, this);       // character-specific details (tie, jacket…)
    // --- back arm (swings opposite to legs) ---
    ctx.strokeStyle = L.shirt; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-8, -29 - bob); ctx.lineTo(-10 + sw * 0.6, -17 - bob); ctx.stroke();
    ctx.fillStyle = L.skin; ctx.fillRect(-13 + sw * 0.6, -19 - bob, 6, 6);
    // --- head (oversized) ---
    ctx.fillStyle = L.skin; ctx.fillRect(-14, -58 - bob, 28, 26);
    ctx.fillStyle = L.hair; ctx.fillRect(-15, -60 - bob, 30, 8); ctx.fillRect(-15, -60 - bob, 6, 18);
    // eyes look toward the truck; squint while attacking
    ctx.fillStyle = '#fff'; ctx.fillRect(2, -49 - bob, 8, 7); ctx.fillRect(-9, -49 - bob, 7, 7);
    ctx.fillStyle = '#000'; ctx.fillRect(6, -47 - bob, 4, 4); ctx.fillRect(-5, -47 - bob, 4, 4);
    ctx.fillRect(-3, -38 - bob, 10, 2);                          // mouth
    if (this.attack) ctx.fillRect(-4, -39 - bob, 12, 4);          // yelling
    if (L.head) L.head(ctx, -bob, this);        // character-specific hair/accessories
    // --- front arm: the punching arm extends toward the truck ---
    ctx.strokeStyle = L.shirt; ctx.lineWidth = 5;
    const fx = punching ? 10 + ext * (MOVES.punch.reach - 10) : 12;
    const fy = punching ? -27 - bob : -18 - bob;
    ctx.beginPath(); ctx.moveTo(8, -29 - bob); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.fillStyle = L.skin; ctx.fillRect(fx - 2, fy - 4, 8, 8);   // fist
    ctx.restore();
  },
};

// Called for every landed hit; later PRs hang scoring/juice off this.
function onTruckHit(type, dealt, px, py) {
  // sparks flying from the impact point
  for (let i = 0; i < 6; i++)
    spawnDebris(px, py, 40 + Math.random() * 180, -Math.random() * 220, 3, 3, i % 2 ? '#ffe14a' : '#d0d5db', 0.7);
}

// ---------------------------------------------------------------------
// 8. Game state machine
//    Each state is {enter(), update(dt), draw()}. PRs 2+ add more states.
// ---------------------------------------------------------------------
const states = {};
let state = null, stateName = '';
function setState(name, arg) {
  stateName = name; state = states[name];
  if (state.enter) state.enter(arg);
}

// Title screen (character select arrives in a later PR)
states.title = {
  t: 0,
  enter() { this.t = 0; },
  update(dt) {
    this.t += dt;
    if (pressed.confirm) setState('game');
  },
  draw() {
    drawBackground();
    drawSalesman(520, GROUND_Y, 1, this.t);
    // big title with a bobbing shadow
    const bob = Math.sin(this.t * 3) * 3;
    text('CYBER', W / 2, 70 + bob, 56, '#ffe14a', 'center', '#7a1d1d');
    text('SMASH', W / 2, 120 + bob, 56, '#ff5a3c', 'center', '#3a0d0d');
    text('Wreck the CYBERCHUNK in 40 seconds!', W / 2, 168, 14, '#fff');
    if (Math.floor(this.t * 2) % 2 === 0) text('PRESS SPACE / ENTER', W / 2, 330, 16, '#fff');
  },
};


// Gameplay state. (Timer, scoring screens and specials are added in the following PRs.)
states.game = {
  enter() { truck.reset(); debris.length = 0; fighter.reset(110); },
  update(dt) {
    fighter.update(dt, !truck.destroyed);
    truck.update(dt); updateDebris(dt);
    if (pressed.back) setState('title');
  },
  draw() {
    drawBackground();
    drawSalesman(590, GROUND_Y, truck.stage >= 3 ? 2 : truck.stage >= 1 ? 1 : 0, truck.t);
    truck.draw(); fighter.draw(); drawDebris();
    drawTruckBar();
    text('SCORE ' + String(fighter.score).padStart(6, '0'), W - 16, 20, 14, '#fff', 'right');
    text('A/D MOVE   J PUNCH   K KICK', W / 2, H - 14, 11, '#fff');
  },
};

// ---------------------------------------------------------------------
// 9. Main loop: fixed 60 Hz update, render every animation frame
// ---------------------------------------------------------------------
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  // clamp big gaps (tab switch) so we don't run a burst of catch-up updates
  acc += Math.min(0.25, (now - last) / 1000);
  last = now;
  while (acc >= STEP) {
    bgTime += STEP;
    state.update(STEP);
    for (const k in pressed) delete pressed[k];   // consume one-shot presses
    acc -= STEP;
  }
  ctx.clearRect(0, 0, W, H);
  state.draw();
  requestAnimationFrame(frame);
}

setState('title');
requestAnimationFrame(frame);
</script>
